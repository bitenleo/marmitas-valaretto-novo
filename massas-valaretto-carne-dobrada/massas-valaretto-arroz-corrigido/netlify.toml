[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/menu"
  to = "/.netlify/functions/menu"
  status = 200


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
